# Manter o mesmo projeto preserva o volume usado na migração local.
name: book-vault-postgres-local

services:
  postgres:
    extends:
      file: compose.postgres.yaml
      service: postgres
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  book-vault:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8000}:8000"
    env_file:
      - .env.postgres
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
