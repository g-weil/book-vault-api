# Banco local para a migração; não inicia nem altera a API atual.
name: book-vault-postgres-local

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    env_file:
      - .env.postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 guarda os dados em um subdiretório versionado.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
